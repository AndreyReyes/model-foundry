[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-foundry"
version = "0.1.0"
description = "A modular, production-minded ML lifecycle platform."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Andrey Reyes" }
]
dependencies = [
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
