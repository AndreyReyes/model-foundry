[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-foundry"
version = "0.1.0"
description = "A modular, production-minded ML lifecycle platform."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Andrey Reyes" }
]
dependencies = [
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = false
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
